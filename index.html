    <!-- Theme, before first paint. The v3 surface reads the same key at runtime
         (src/lib/theme-store.ts); resolving it here as well is what keeps a
         visitor whose system is dark from being shown a white page first. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark" || (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
